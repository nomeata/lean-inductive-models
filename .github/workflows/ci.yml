name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bound Lake's build parallelism. Lake 5.0.0 has no job-count flag: `-j`
# was dropped and `-K key=value` only sets a *configuration file* option
# that this lakefile never reads, so the `-Kjobs=1` this workflow used to
# pass was inert -- byte-for-byte the same build as passing nothing.
#
# Lake schedules its build jobs as Lean tasks, so the Lean runtime's thread
# pool is the real control, and `LEAN_NUM_THREADS` sizes it. Measured on a
# 96-core host, clean `lake build lean-inductive-models`:
#
#   setting     wall     user     CPU/wall   peak summed PSS
#   (none)      39.4 s   160.5 s   4.58x      3.00 GiB
#   -Kjobs=1    39.3 s   160.1 s   4.59x      2.96 GiB   <- inert
#   =4          54.0 s   155.8 s   3.25x      2.41 GiB
#   =2          89.7 s   156.8 s   1.97x      1.90 GiB
#   =1         164.8 s   158.1 s   1.08x      1.92 GiB
#
# 4 is the bound, not 1: full serialization costs 4.2x wall to save 0.5 GiB
# of a 6 GiB budget. The variable is a Lean-runtime-wide bound, so it also
# caps each `lean` child's own threads; that costs nothing here (a single
# `lean` frontend on the heaviest module runs at 1.22x CPU/wall whatever
# this is set to). On a 2-4 core hosted runner the bound is at or above what
# the runner can do anyway -- its value is making the ceiling the same on
# every machine, including maintainer workstations.
env:
  LEAN_NUM_THREADS: "4"

jobs:
  arena:
    name: Arena corpus with model generation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_tmp

    steps:
      - uses: actions/checkout@v6

      - name: Prepare project-local temporary directory
        run: mkdir -p _tmp

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Build models and validate the Arena corpus
        shell: bash
        run: |
          set -euo pipefail

          # No `ulimit -v` here. That bounds VIRTUAL ADDRESS SPACE, never
          # resident memory, and since the v4.33.0 toolchain the two have
          # nothing to do with each other: a v4.33.0 `lean` reserves about
          # 12.8 GiB of address space at startup for allocator arenas while
          # its peak RSS is unchanged at roughly 2.0 GiB. A cap low enough to
          # catch a runaway aborts every `lean` with "failed to create
          # thread"; a cap high enough to let it start measures nothing.
          # RSS is the quantity of interest and the runner's own 16 GiB, with
          # the job timeout, is what bounds it here. scripts/ci-mathlib.sh
          # carries the enforced per-phase budgets, as cgroup memory limits.
          PYTHONPYCACHEPREFIX="$TMPDIR/pycache" \
            python3 -m py_compile test/scripts/check_arena_corpus.py
          PYTHONDONTWRITEBYTECODE=1 python3 test/scripts/test_arena_corpus_runner.py
          lake build lean-inductive-models
          test/scripts/check_arena_corpus.py

  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_tmp
    strategy:
      fail-fast: false
      matrix:
        suite: [fixtures, focused, cli]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare project-local temporary directory
        run: mkdir -p _tmp

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Build and run ${{ matrix.suite }} suite
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail

          # No `ulimit -v` here; see the Arena job for why. It bounds virtual
          # address space, which a v4.33.0 `lean` reserves about 12.8 GiB of
          # at startup against an unchanged 2.0 GiB peak RSS, so no value of
          # it both lets `lean` start and catches a runaway. RSS is the
          # quantity of interest; the runner's 16 GiB bounds it here.

          # `LEAN_NUM_THREADS` (workflow env) is what bounds parallelism; see
          # the comment on it for why the `-Kjobs=1` that used to appear here
          # was inert. One root per Lake invocation is a separate and weaker
          # property: it keeps at most one *target link* live and names the
          # target that failed. Within one invocation Lake still runs up to
          # LEAN_NUM_THREADS jobs at once, so this loop is not serialization.
          build_bounded() {
            local target
            for target in "$@"; do
              lake build "$target"
            done
          }
          compile_only_targets=(
            FamilyAdapterConstruction
            FamilyAdapterPlan
            FamilyAdapterShadow
            OneLayerProjectionPrototype
            OneLayerRecursorProof
          )
          test/scripts/check-ci-serialized-builds.sh
          test/scripts/check-checker-imports.sh
          test/scripts/check-lean4export-patch.sh

          case "$SUITE" in
            fixtures)
              build_bounded lean-inductive-models test
              lake exe test "$GITHUB_WORKSPACE" | tee _tmp/fixtures.log
              test/scripts/check-hard-nested-a.sh
              test/scripts/check-hard-nested-c.sh
              count="$(sed -nE 's/^([0-9]+) checks, 0 failed$/\1/p' _tmp/fixtures.log | tail -n1)"
              ;;
            focused)
              test/scripts/check-mathlib-result.sh
              build_bounded "${compile_only_targets[@]}"
              build_bounded \
                clitest generationflagstest checktest kernelchecktest \
                familyadapterplantest familyadaptershadowtest familyadapterconstructiontest \
                ordertest incrementalordertest namingtest \
                drivernamingtest privatealiastest sourcereplayaliastest simplenamingtest rulektest \
                defaultctoriotatest sourcestructuresyntaxtest composedrecursorsyntaxtest \
                projectiontest projectiontransportcensustest \
                emissionordercensustest \
                indexedfibrediagnostictest mutualonelayerdiagnostictest \
                structureetatest deepimaxboxtest \
                psigmaprimetest exactsortlifttest tightpsigmaprimeroutetest \
                vanishingerasuretest transparentowneraliasestest \
                exportsyntaxnormalizationtest basisvalidationtest arenaformattest
              lake exe clitest
              lake exe generationflagstest
              lake exe checktest "$GITHUB_WORKSPACE"
              lake exe kernelchecktest "$GITHUB_WORKSPACE"
              lake exe familyadapterplantest
              lake exe familyadaptershadowtest
              lake exe familyadapterconstructiontest
              lake exe ordertest "$GITHUB_WORKSPACE"
              lake exe incrementalordertest "$GITHUB_WORKSPACE"
              lake exe namingtest
              lake exe drivernamingtest
              lake exe privatealiastest
              lake exe sourcereplayaliastest
              lake exe simplenamingtest
              lake exe rulektest
              lake exe defaultctoriotatest "$GITHUB_WORKSPACE"
              lake exe sourcestructuresyntaxtest "$GITHUB_WORKSPACE"
              lake exe composedrecursorsyntaxtest "$GITHUB_WORKSPACE"
              lake exe projectiontest
              lake exe projectiontransportcensustest "$GITHUB_WORKSPACE"
              lake exe emissionordercensustest "$GITHUB_WORKSPACE"
              lake exe indexedfibrediagnostictest "$GITHUB_WORKSPACE"
              lake exe mutualonelayerdiagnostictest "$GITHUB_WORKSPACE"
              lake exe structureetatest
              lake exe deepimaxboxtest
              lake exe psigmaprimetest
              lake exe exactsortlifttest
              lake exe tightpsigmaprimeroutetest
              lake exe vanishingerasuretest
              lake exe transparentowneraliasestest
              lake exe exportsyntaxnormalizationtest
              lake exe basisvalidationtest
              lake exe arenaformattest "$GITHUB_WORKSPACE"
              PYTHONDONTWRITEBYTECODE=1 python3 test/scripts/test_family_adapter_fixture_generator.py
              python3 test/scripts/generate_family_adapter_fixtures.py \
                --output test/fixtures/inductive-models/family_adapter_generated.lean --check
              count=33
              ;;
            cli)
              build_bounded lean-inductive-models mainclitest
              lake exe mainclitest "$GITHUB_WORKSPACE" | tee _tmp/maincli.log
              cli_count="$(sed -nE 's/^main CLI: ([0-9]+) passed, 0 failed$/\1/p' _tmp/maincli.log | tail -n1)"
              if [[ -z "$cli_count" ]]; then
                echo "CLI suite did not report lean-inductive-models CLI checks" >&2
                exit 1
              fi
              count="$cli_count"
              ;;
            *)
              echo "unknown suite: $SUITE" >&2
              exit 2
              ;;
          esac

          if [[ -z "$count" || "$count" -eq 0 ]]; then
            echo "$SUITE suite did not report a positive check count" >&2
            exit 1
          fi
