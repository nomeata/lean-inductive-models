name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    name: Lean Kernel Arena corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_tmp

    steps:
      - uses: actions/checkout@v6

      - name: Prepare project-local temporary directory
        run: mkdir -p _tmp

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Build modelgen and check the Arena corpus
        shell: bash
        run: |
          set -euo pipefail

          # Each process is capped at 12 GiB and cannot raise its own limit.
          ulimit -Sv 12582912
          ulimit -Hv 12582912

          lake -Kjobs=1 build modelgen
          test/scripts/check-arena-corpus.sh

  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_tmp
    strategy:
      fail-fast: false
      matrix:
        suite: [fixtures, focused, mono]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare project-local temporary directory
        run: mkdir -p _tmp

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Build and run ${{ matrix.suite }} suite
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail

          # Each process is capped at 12 GiB and cannot raise its own limit.
          ulimit -Sv 12582912
          ulimit -Hv 12582912

          # A single `lake build` with several roots may schedule the roots'
          # final native links together even with `-Kjobs=1`. Build each root
          # in its own Lake invocation so at most one target link is live.
          build_serially() {
            local target
            for target in "$@"; do
              lake -Kjobs=1 build "$target"
            done
          }
          test/scripts/check-ci-serialized-builds.sh

          case "$SUITE" in
            fixtures)
              build_serially modelgen test
              lake exe test "$GITHUB_WORKSPACE" | tee _tmp/fixtures.log
              test/scripts/check-hard-nested-a.sh
              test/scripts/check-hard-nested-c.sh
              count="$(sed -nE 's/^([0-9]+) checks, 0 failed$/\1/p' _tmp/fixtures.log | tail -n1)"
              ;;
            focused)
              test/scripts/check-mathlib-result.sh
              build_serially \
                clitest generationflagstest checktest ordertest incrementalordertest namingtest \
                drivernamingtest privatealiastest simplenamingtest rulektest \
                defaultctoriotatest \
                projectiontest structureetatest deepimaxboxtest \
                psigmaprimetest exactsortlifttest tightpsigmaprimeroutetest \
                vanishingerasuretest transparentowneraliasestest \
                exportsyntaxnormalizationtest basisvalidationtest stagedwritertest
              lake exe clitest
              lake exe generationflagstest
              lake exe checktest "$GITHUB_WORKSPACE"
              lake exe ordertest "$GITHUB_WORKSPACE"
              lake exe incrementalordertest "$GITHUB_WORKSPACE"
              lake exe namingtest
              lake exe drivernamingtest
              lake exe privatealiastest
              lake exe simplenamingtest
              lake exe rulektest
              lake exe defaultctoriotatest "$GITHUB_WORKSPACE"
              lake exe projectiontest
              lake exe structureetatest
              lake exe deepimaxboxtest
              lake exe psigmaprimetest
              lake exe exactsortlifttest
              lake exe tightpsigmaprimeroutetest
              lake exe vanishingerasuretest
              lake exe transparentowneraliasestest
              lake exe exportsyntaxnormalizationtest
              lake exe basisvalidationtest
              lake exe stagedwritertest "$GITHUB_WORKSPACE"
              count=22
              ;;
            mono)
              build_serially modelgen monotest mainclitest
              lake exe monotest "$GITHUB_WORKSPACE" | tee _tmp/mono.log
              mono_count="$(sed -nE 's/^monotest: ([0-9]+) checks, all pass$/\1/p' _tmp/mono.log | tail -n1)"
              lake exe mainclitest "$GITHUB_WORKSPACE" | tee _tmp/maincli.log
              cli_count="$(sed -nE 's/^main CLI: ([0-9]+) passed, 0 failed$/\1/p' _tmp/maincli.log | tail -n1)"
              if [[ -z "$mono_count" || -z "$cli_count" ]]; then
                echo "mono suite did not report both library and modelgen CLI checks" >&2
                exit 1
              fi
              count="$((mono_count + cli_count))"
              ;;
            *)
              echo "unknown suite: $SUITE" >&2
              exit 2
              ;;
          esac

          if [[ -z "$count" || "$count" -eq 0 ]]; then
            echo "$SUITE suite did not report a positive check count" >&2
            exit 1
          fi
