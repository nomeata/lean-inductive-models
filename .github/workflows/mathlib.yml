name: Full Mathlib

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-mathlib
  cancel-in-progress: true

jobs:
  mathlib:
    name: Full Mathlib (standard hosted trial)
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      TMPDIR: ${{ github.workspace }}/_tmp/tmp

    steps:
      - uses: actions/checkout@v6

      - name: Prepare project-local temporary directories
        run: mkdir -p _tmp/tmp _tmp/logs _tmp/perf

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Export and check full Mathlib
        shell: bash
        run: bash scripts/ci-mathlib.sh
