name = "lean_inductive_models"

# `lake test` is the quick fixture suite, which is now one suite of the one test
# executable rather than the whole of it: without the argument the dispatcher
# would print its registry and exit 2.
testDriver = "test"
testDriverArgs = ["fixtures"]

defaultTargets = ["lean-inductive-models"]

[[lean_lib]]
name = "InductiveModels"
srcDir = "src"
globs = ["InductiveModels.+"]

[[lean_exe]]
name = "lean-inductive-models"
srcDir = "src"
root = "Main"
supportInterpreter = true

# One binary for every suite, dispatching on its first argument; see
# `test/TestMain.lean`. `Test.runCli` and `MainCliTest` spawn
# `.lake/build/bin/lean-inductive-models` as a subprocess, so the CLI target has
# to be built before those suites run. Without the `needs` they silently assert
# the CLI contract against whatever stale binary is on disk.
[[lean_exe]]
name = "test"
srcDir = "test"
root = "TestMain"
needs = ["@/lean-inductive-models"]
supportInterpreter = true

# The suite modules the dispatcher imports. Lake resolves an import to a module
# of a declared library, so a suite that is no longer its own executable root
# has to be listed here to be found at all -- and a suite missing from this list
# fails the build rather than being silently skipped, because `TestMain` imports
# every one of them.
[[lean_lib]]
name = "TestSuites"
srcDir = "test"
roots = [
  "Test", "CliTest", "GenerationFlagsTest", "CheckTest", "KernelCheckTest",
  "OrderTest", "IncrementalOrderTest", "NamingTest", "DriverNamingTest",
  "PrivateAliasTest", "SourceReplayAliasTest", "SimpleNamingTest", "RuleKTest",
  "DefaultCtorIotaTest", "SourceStructureSyntaxTest", "ComposedRecursorSyntaxTest",
  "MainCliTest", "ProjectionTest", "ProjectionTransportCensusTest",
  "EmissionOrderCensusTest", "IndexedFibreDiagnosticTest",
  "MutualOneLayerDiagnosticTest", "StructureEtaTest", "DeepImaxBoxTest",
  "PSigmaPrimeTest", "ExactSortLiftTest", "TightPSigmaPrimeRouteTest",
  "VanishingErasureTest", "TransparentOwnerAliasTest",
  "ExportSyntaxNormalizationTest", "BasisValidationTest", "ArenaFormatTest",
  "MemoryProbe",
]

# The two compile-only proof oracles: nothing imports them, so `lake build test`
# does not compile them and `test/scripts/run-correctness.sh` builds them by
# name.
[[lean_lib]]
name = "OneLayerProjectionPrototype"
srcDir = "test"
roots = ["OneLayerProjectionPrototype"]

# Diagnostics: these targets are useful during development, but are not
# correctness suites and are not part of the default build.
[[lean_exe]]
name = "envprobe"
srcDir = "tools"
root = "EnvProbe"
supportInterpreter = true

[[lean_exe]]
name = "levelfuzz"
srcDir = "tools"
root = "LevelFuzz"
